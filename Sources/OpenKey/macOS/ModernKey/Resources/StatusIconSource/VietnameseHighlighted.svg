<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <title>Vietnamese mode V keycap menu bar icon</title>
  <defs><mask id="v-cutout" maskUnits="userSpaceOnUse" mask-type="luminance" x="0" y="0" width="22" height="22">
    <rect width="22" height="22" fill="#FFFFFF"/>
    <text x="11" y="11" text-anchor="middle" dominant-baseline="central"
          font-family="SF Pro, Helvetica Neue, sans-serif" font-size="14.5" font-weight="700"
          fill="#000000">V</text>
  </mask></defs>
  <rect x="2.5" y="2.5" width="17" height="17" rx="4.2" fill="#FFFFFF" mask="url(#v-cutout)"/>
</svg>
